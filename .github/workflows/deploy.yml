name: Deploy to GitHub Pages

# Un solo sitio de Pages con tres builds:
#   main      → raíz        (https://4brewebs.github.io/UmbralXpectre/)
#   stable-v1 → /stable-v1/ (https://4brewebs.github.io/UmbralXpectre/stable-v1/), congelada
#   develop   → /qa/        (https://4brewebs.github.io/UmbralXpectre/qa/), VITE_APP_ENV=qa
# Un push a cualquiera de las tres ramas reconstruye y publica las tres.
on:
  push:
    branches: [main, develop, stable-v1]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: develop
          path: develop
      - uses: actions/checkout@v4
        with:
          ref: stable-v1
          path: stable-v1
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            main/package-lock.json
            develop/package-lock.json
            stable-v1/package-lock.json
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build main (producción, raíz)
        working-directory: main
        run: |
          npm ci
          APP_COMMIT=$(git rev-parse HEAD) npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          APP_BRANCH: main
          VITE_APP_ENV: prod
      - name: Build develop (QA, /qa/)
        working-directory: develop
        run: |
          npm ci
          APP_COMMIT=$(git rev-parse HEAD) npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/qa/
          APP_BRANCH: develop
          VITE_APP_ENV: qa
      - name: Build stable-v1 (versión estable congelada, /stable-v1/)
        working-directory: stable-v1
        run: |
          npm ci
          APP_COMMIT=$(git rev-parse HEAD) npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/stable-v1/
          APP_BRANCH: stable-v1
          VITE_APP_ENV: prod
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r main/dist/. site/
          rm -rf site/qa
          mkdir -p site/qa
          cp -r develop/dist/. site/qa/
          rm -rf site/stable-v1
          mkdir -p site/stable-v1
          cp -r stable-v1/dist/. site/stable-v1/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
